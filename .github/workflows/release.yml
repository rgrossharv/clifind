name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test --locked
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo build --locked --release --target x86_64-unknown-linux-musl
          mkdir package
          cp target/x86_64-unknown-linux-musl/release/clifind package/
          tar -C package -czf "clifind-${version}-x86_64-unknown-linux-musl.tar.gz" clifind
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: clifind-*.tar.gz

  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo build --locked --release --target "${{ matrix.target }}"
          mkdir package
          cp "target/${{ matrix.target }}/release/clifind" package/
          tar -C package -czf "clifind-${version}-${{ matrix.target }}.tar.gz" clifind
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: clifind-*.tar.gz

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          sha256sum clifind-*.tar.gz > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
